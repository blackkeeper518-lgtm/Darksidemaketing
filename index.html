<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN MATRIX CORE V.72 - NEURAL SHOGUN ELITE</title>
    
    <!-- ⚡ HIGH-POWERED NEURAL LIBRARIES (CDNs) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 📦 FIREBASE SOVEREIGN SDKS -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- 🎨 ASSETS & ICONS (STABLE VERSION) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #010102; color: #f1f5f9; margin: 0; overflow-x: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .nebula { position: fixed; inset: 0; pointer-events: none; z-index: 0; transition: background 1.2s ease; }
        .glass { background: rgba(8, 8, 12, 0.92); backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1.5rem; }
        .matrix-text { text-shadow: 0 0 15px currentColor; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .animate-ticker { animation: ticker 25s linear infinite; }
        .radar-pulse { animation: pulse-red 2s infinite ease-out; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- 🛡️ CONFIGURATION GATEWAY ---
        const firebaseConfig = JSON.parse(window.__firebase_config || '{}');
        const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'darkside-bb-v4';
        const apiKey = ""; // Gemini API Key

        if (firebaseConfig.apiKey && !firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // --- 🛡️ ULTIMATE SAFE ICON COMPONENT (Prevents DOM Errors) ---
        const SafeIcon = ({ name, className = "w-5 h-5", color = "currentColor" }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current && window.lucide) {
                    containerRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    window.lucide.createIcons({
                        node: containerRef.current,
                        attrs: { class: className, stroke: color, "stroke-width": 2 }
                    });
                }
            }, [name, className, color]);
            return <span ref={containerRef} className="inline-flex pointer-events-none" />;
        };

        // --- ✨ AI NEURAL LINK ENGINE (GEMINI) ---
        const callGemini = async (prompt, systemPrompt = "You are the TITAN MATRIX AI. Supreme Military Strategist. Response in Thai.") => {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Signal Severed.";
            } catch (e) { return "AI Link Refused."; }
        };

        function App() {
            const [brand, setBrand] = useState('BB');
            const [activeTab, setActiveTab] = useState('dashboard');
            const [orders, setOrders] = useState([]);
            const [user, setUser] = useState(null);
            const [editingId, setEditingId] = useState(null);
            const [psidInput, setPsidInput] = useState('');
            const [aiChat, setAiChat] = useState([]);
            const [chatInput, setChatInput] = useState('');
            const [isChatting, setIsChatting] = useState(false);

            const theme = useMemo(() => brand === 'BB' ? {
                primary: '#f0abfc', glow: '#e879f9', text: 'BB STORE', table: 'bb_orders_master', icon: 'stars'
            } : {
                primary: '#fed7aa', glow: '#fb923c', text: 'SINGTO', table: 'st_orders_master', icon: 'cat'
            }, [brand]);

            const stats = useMemo(() => ({
                total: orders.reduce((s, o) => s + (Number(o.cod_amount) || 0), 0),
                count: orders.length,
                ready: orders.filter(o => o.strike_status === 'ready').length,
                missing: orders.filter(o => !o.psid).length
            }), [orders]);

            useEffect(() => {
                const auth = firebase.auth();
                const initAuth = async () => {
                    try {
                        if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
                            await auth.signInWithCustomToken(window.__initial_auth_token);
                        } else { await auth.signInAnonymously(); }
                    } catch (err) { console.error("Identity Denied", err); }
                };
                initAuth();
                const unsubscribe = auth.onAuthStateChanged(u => setUser(u));
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user || !firebase.apps.length) return;
                const db = firebase.firestore();
                const unsubscribe = db.collection('artifacts').doc(appId)
                    .collection('public').doc('data').collection(theme.table)
                    .onSnapshot((snapshot) => {
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setOrders(data.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0)));
                    }, (err) => console.error("Telemetry Error", err));
                return () => unsubscribe();
            }, [user, brand, theme.table]);

            const handleSavePsid = async (id) => {
                if (!psidInput.trim() || !user) return;
                const db = firebase.firestore();
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(theme.table).doc(id)
                        .update({ psid: psidInput.trim(), strike_status: 'ready', updated_at: firebase.firestore.FieldValue.serverTimestamp() });
                    setEditingId(null);
                    setPsidInput('');
                } catch (err) { console.error("Target Lock Error", err); }
            };

            const sendChat = async () => {
                if (!chatInput.trim()) return;
                const msg = chatInput;
                setAiChat(p => [...p, { role: 'user', text: msg }]);
                setChatInput('');
                setIsChatting(true);
                const res = await callGemini(msg);
                setAiChat(p => [...p, { role: 'ai', text: res }]);
                setIsChatting(false);
            };

            if (!user) return (
                <div className="min-h-screen bg-[#010102] flex items-center justify-center">
                    <div className="flex flex-col items-center gap-6">
                        <div className="w-12 h-12 border-2 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
                        <span className="font-black uppercase tracking-[0.5em] text-[10px] text-white/30 animate-pulse">Syncing Sovereign Link...</span>
                    </div>
                </div>
            );

            return (
                <div className="relative min-h-screen pb-20 overflow-x-hidden">
                    <div className="nebula" style={{ background: `radial-gradient(circle at 50% 50%, ${brand === 'BB' ? 'rgba(147,51,234,0.12)' : 'rgba(234,88,12,0.1)'}, transparent 70%)` }} />
                    <nav className="sticky top-0 z-50 p-4 border-b border-white/5 bg-black/40 backdrop-blur-3xl flex justify-between items-center px-6 md:px-12 shadow-2xl">
                        <div className="flex items-center gap-4">
                            <div className="p-2.5 rounded-2xl bg-white/5 border border-white/10 shadow-[0_0_20px_rgba(255,255,255,0.05)]" style={{color: theme.primary}}>
                                <SafeIcon name={theme.icon} className="w-6 h-6" />
                            </div>
                            <span className="font-black uppercase tracking-tighter text-xl matrix-text" style={{color: theme.primary}}>{theme.text} COMMAND</span>
                        </div>
                        <div className="flex gap-4 items-center">
                            <button onClick={() => setBrand(brand === 'BB' ? 'SINGTO' : 'BB')} className="p-2 text-white/20 hover:text-white transition-all scale-110 active:rotate-180 duration-500"><SafeIcon name="refresh-cw" className="w-5 h-5" /></button>
                            <div className="flex bg-white/5 p-1 rounded-xl border border-white/10 shadow-inner">
                                <button onClick={() => setActiveTab('dashboard')} className={`px-5 py-2 rounded-lg text-xs font-black transition-all ${activeTab === 'dashboard' ? 'bg-white text-black shadow-xl' : 'text-white/30 hover:text-white'}`}>DASHBOARD</button>
                                <button onClick={() => setActiveTab('vault')} className={`px-5 py-2 rounded-lg text-xs font-black transition-all ${activeTab === 'vault' ? 'bg-white text-black shadow-xl' : 'text-white/30 hover:text-white'}`}>VAULT</button>
                            </div>
                        </div>
                    </nav>

                    <main className="relative z-10 p-6 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 mt-6">
                        <div className="lg:col-span-4 space-y-6">
                            <div className="glass p-8 grid grid-cols-2 gap-4 border-b-4 shadow-2xl" style={{borderBottomColor: theme.primary}}>
                                <div><span className="text-[10px] opacity-30 font-black uppercase tracking-widest block mb-1">Revenue</span><div className="text-3xl font-light tracking-tighter">฿{stats.total.toLocaleString()}</div></div>
                                <div><span className="text-[10px] opacity-30 font-black uppercase tracking-widest block mb-1">Assets</span><div className="text-3xl font-light tracking-tighter">{stats.count}</div></div>
                            </div>
                            <div className="glass p-6 h-[450px] flex flex-col border border-white/5 shadow-2xl">
                                <span className="text-[10px] font-black uppercase opacity-20 mb-6 tracking-widest flex items-center gap-2"><SafeIcon name="brain" className="w-3 h-3" color="#a855f7" /> Intelligence Terminal</span>
                                <div className="flex-1 overflow-y-auto space-y-4 font-mono text-xs pr-2 custom-scrollbar">
                                    {aiChat.length === 0 && <div className="text-center mt-20 opacity-5 font-black uppercase text-2xl tracking-tighter italic">Silence Protocol</div>}
                                    {aiChat.map((c, i) => (
                                        <div key={i} className={`flex ${c.role === 'user' ? 'justify-end' : 'justify-start'} animate-in fade-in slide-in-from-bottom-2`}>
                                            <div className={`p-4 rounded-2xl max-w-[90%] shadow-lg ${c.role === 'user' ? 'bg-white/10 rounded-tr-none' : 'bg-purple-900/30 border border-purple-500/20 rounded-tl-none'}
