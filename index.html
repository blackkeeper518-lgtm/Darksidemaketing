<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN MATRIX CORE V.74 - NEURAL FIX</title>
    
    <!-- ⚡ HIGH-POWERED NEURAL LIBRARIES -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 📦 FIREBASE SDKS -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- 🎨 ASSETS & ICONS -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #010102; color: #f1f5f9; margin: 0; overflow-x: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .nebula { position: fixed; inset: 0; pointer-events: none; z-index: 0; transition: background 1.5s ease; }
        .glass { background: rgba(8, 8, 12, 0.95); backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 1.5rem; }
        .matrix-text { text-shadow: 0 0 15px currentColor; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .animate-ticker { animation: ticker 25s linear infinite; }
        .radar-pulse { animation: pulse-red 2s infinite ease-out; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- 🛡️ CONFIGURATION GATEWAY (Safety First) ---
        let firebaseConfig = {};
        try {
            // ดึงจาก Environment หรือใส่ค่า Manual ตรงนี้ได้เลยครับจอมทัพ
            firebaseConfig = JSON.parse(window.__firebase_config || '{}');
        } catch (e) {
            console.error("Config Parsing Failed");
        }

        const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'darkside-bb-v4';
        const apiKey = ""; // Gemini API Key

        // --- 🏗️ INITIALIZE ENGINE ---
        const initFirebase = () => {
            if (firebaseConfig.apiKey && !firebase.apps.length) {
                try {
                    firebase.initializeApp(firebaseConfig);
                    return true;
                } catch (e) {
                    console.error("Firebase Init Failed", e);
                    return false;
                }
            }
            return firebase.apps.length > 0;
        };

        // --- 🛡️ SAFE ICON COMPONENT (The removeChild Fix) ---
        const SafeIcon = ({ name, className = "w-5 h-5", color = "currentColor" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    window.lucide.createIcons({
                        node: iconRef.current,
                        attrs: { class: className, stroke: color, "stroke-width": 2 }
                    });
                }
            }, [name, className, color]);
            return <span ref={iconRef} className="inline-flex pointer-events-none" />;
        };

        // --- ✨ AI NEURAL LINK ---
        const callGemini = async (prompt, systemPrompt = "You are the TITAN MATRIX AI. Supreme Military Strategist. Response in Thai.") => {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Signal Severed.";
            } catch (e) { return "AI Link Refused."; }
        };

        function App() {
            const [brand, setBrand] = useState('BB');
            const [activeTab, setActiveTab] = useState('dashboard');
            const [orders, setOrders] = useState([]);
            const [user, setUser] = useState(null);
            const [editingId, setEditingId] = useState(null);
            const [psidInput, setPsidInput] = useState('');
            const [aiChat, setAiChat] = useState([]);
            const [chatInput, setChatInput] = useState('');
            const [isChatting, setIsChatting] = useState(false);
            const [engineReady, setEngineReady] = useState(false);

            const theme = useMemo(() => brand === 'BB' ? {
                primary: '#f0abfc', glow: '#e879f9', text: 'BB STORE', table: 'bb_orders_master', icon: 'stars'
            } : {
                primary: '#fed7aa', glow: '#fb923c', text: 'SINGTO', table: 'st_orders_master', icon: 'cat'
            }, [brand]);

            const stats = useMemo(() => ({
                total: orders.reduce((s, o) => s + (Number(o.cod_amount) || 0), 0),
                count: orders.length,
                ready: orders.filter(o => o.strike_status === 'ready').length,
                missing: orders.filter(o => !o.psid).length
            }), [orders]);

            // --- ⚙️ BOOT SEQUENCE ---
            useEffect(() => {
                const isReady = initFirebase();
                setEngineReady(isReady);

                if (isReady) {
                    const auth = firebase.auth();
                    const initAuth = async () => {
                        try {
                            if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
                                await auth.signInWithCustomToken(window.__initial_auth_token);
                            } else { await auth.signInAnonymously(); }
                        } catch (err) { console.error("Identity Denied", err); }
                    };
                    initAuth();
                    const unsubscribe = auth.onAuthStateChanged(u => setUser(u));
                    return () => unsubscribe();
                }
            }, []);

            // --- 📡 DATA SYNC ---
            useEffect(() => {
                if (!user || !engineReady) return;
                const db = firebase.firestore();
                const unsubscribe = db.collection('artifacts').doc(appId)
                    .collection('public').doc('data').collection(theme.table)
                    .onSnapshot((snapshot) => {
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setOrders(data.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0)));
                    }, (err) => console.error("Telemetry Error", err));
                return () => unsubscribe();
            }, [user, brand, theme.table, engineReady]);

            const handleSavePsid = async (id) => {
                if (!psidInput.trim() || !user) return;
                const db = firebase.firestore();
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(theme.table).doc(id)
                        .update({ psid: psidInput.trim(), strike_status: 'ready', updated_at: firebase.firestore.FieldValue.serverTimestamp() });
                    setEditingId(null);
                    setPsidInput('');
                } catch (err) { console.error("Lock-on Error", err); }
            };

            const sendChat = async () => {
                if (!chatInput.trim()) return;
                const msg = chatInput;
                setAiChat(p => [...p, { role: 'user', text: msg }]);
                setChatInput('');
                setIsChatting(true);
                const res = await callGemini(msg);
                setAiChat(p => [...p, { role: 'ai', text: res }]);
                setIsChatting(false);
            };

            // --- 🚩 SAFETY SCREENS ---
            if (!engineReady) return (
                <div className="min-h-screen bg-black flex items-center justify-center p-8">
                    <div className="glass max-w-md w-full p-10 border-red-500/30 text-center">
                        <SafeIcon name="alert-triangle" className="w-16 h-16 text-red-500 mb-6" />
                        <h2 className="text-2xl font-black uppercase mb-4 tracking-tighter">System Critical</h2>
                        <p className="text-sm text-white/40 mb-8 leading-relaxed">จอมทัพครับ! ระบบไม่พบกุญแจคลังแสง (Firebase Config) กรุณาป้อนรหัสลงใน GitHub หรือตั้งค่า Environment ใน Vercel เพื่อปลดล็อคการใช้งานครับ</p>
                        <div className="bg-white/5 p-4 rounded-xl border border-white/10 font-mono text-[10px] text-left opacity-50">
                            Error: Firebase configuration missing.
                        </div>
                    </div>
                </div>
            );

            if (!user) return (
                <div className="min-h-screen bg-[#010102] flex items-center justify-center">
                    <div className="flex flex-col items-center gap-6">
                        <div className="w-12 h-12 border-2 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
                        <span className="font-black uppercase tracking-[0.5em] text-[10px] text-white/30">Initializing Matrix...</span>
                    </div>
                </div>
            );

            return (
                <div className="relative min-h-screen pb-20 overflow-x-hidden animate-in fade-in duration-1000">
                    <div className="nebula" style={{ background: `radial-gradient(circle at 50% 50%, ${brand === 'BB' ? 'rgba(147,51,234,0.12)' : 'rgba(234,88,12,0.1)'}, transparent 70%)` }} />
                    
                    <nav className="sticky top-0 z-50 p-4 border-b border-white/5 bg-black/40 backdrop-blur-3xl flex justify-between items-center px-6 md:px-12">
                        <div className="flex items-center gap-4">
                            <div className="p-2 bg-white/5 rounded-xl border border-white/10" style={{color: theme.primary}}>
                                <SafeIcon name={theme.icon} className="w-6 h-6" />
                            </div>
                            <span className="font-black uppercase tracking-tighter text-xl matrix-text" style={{color: theme.primary}}>{theme.text} COMMAND</span>
                        </div>
                        <div className="flex gap-4 items-center">
                            <button onClick={() => setBrand(brand === 'BB' ? 'SINGTO' : 'BB')} className="p-2 text-white/20 hover:text-white transition-all"><SafeIcon name="refresh-cw" className="w-5 h-5" /></button>
                            <div className="flex bg-white/5 p-1 rounded-xl border border-white/10">
                                <button onClick={() => setActiveTab('dashboard')} className={`px-5 py-2 rounded-lg text-xs font-black transition-all ${activeTab === 'dashboard' ? 'bg-white text-black shadow-lg' : 'text-white/30'}`}>DASHBOARD</button>
                                <button onClick={() => setActiveTab('vault')} className={`px-5 py-2 rounded-lg text-xs font-black transition-all ${activeTab === 'vault' ? 'bg-white text-black shadow-lg' : 'text-white/30'}`}>VAULT</button>
                            </div>
                        </div>
                    </nav>

                    <main className="relative z-10 p-6 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 mt-6">
                        <div className="lg:col-span-4 space-y-6">
                            <div className="glass p-8 grid grid-cols-2 gap-4 border-b-4 shadow-2xl" style={{borderBottomColor: theme.primary}}>
                                <div><span className="text-[10px] opacity-30 font-black uppercase tracking-widest block mb-1">Revenue</span><div className="text-3xl font-light tracking-tighter">฿{stats.total.toLocaleString()}</div></div>
                                <div><span className="text-[10px] opacity-30 font-black uppercase tracking-widest block mb-1">Assets</span><div className="text-3xl font-light tracking-tighter">{stats.count}</div></div>
                            </div>

                            <div className="glass p-6 h-[450px] flex flex-col border border-white/5 shadow-2xl">
                                <span className="text-[10px] font-black uppercase opacity-20 mb-6 tracking-widest flex items-center gap-2"><SafeIcon name="brain" className="w-3 h-3" color="#a855f7" /> Intelligence Terminal</span>
                                <div className="flex-1 overflow-y-auto space-y-4 font-mono text-xs pr-2">
                                    {aiChat.map((c, i) => (
                                        <div key={i} className={`flex ${c.role === 'user' ? 'justify-end' : 'justify-start'} animate-in slide-in-from-bottom-2`}>
                                            <div className={`p-4 rounded-2xl max-w-[90%] ${c.role === 'user' ? 'bg-white/10' : 'bg-purple-900/30 border border-purple-500/20'}`}>{c.text}</div>
                                        </div>
                                    ))}
                                    {isChatting && <div className="ml-4 opacity-30 flex items-center gap-2"><SafeIcon name="loader-2" className="animate-spin w-4 h-4" /><span className="text-[10px] font-black tracking-widest uppercase">Thinking...</span></div>}
                                </div>
                                <div className="mt-6 flex gap-2">
                                    <input value={chatInput} onChange={e => setChatInput(e.target.value)} onKeyPress={e => e.key === 'Enter' && sendChat()} className="flex-1 bg-black border border-white/10 rounded-xl px-5 py-3 text-xs outline-none focus:border-purple-500/50 transition-all" placeholder="Command AI..." />
                                    <button onClick={sendChat} className="p-3 bg-white text-black rounded-xl hover:scale-105 active:scale-95 transition-all shadow-[0_0_20px_#fff]"><SafeIcon name="send" className="w-4 h-4" /></button>
                                </div>
                            </div>
                        </div>

                        <div className="lg:col-span-8">
                            {activeTab === 'dashboard' ? (
                                <div className="space-y-8 animate-in slide-in-from-bottom-4 duration-700">
                                    <div className="glass p-32 border-2 border-dashed border-white/10 flex flex-col items-center justify-center gap-8 group hover:border-white/20 transition-all cursor-pointer relative overflow-hidden">
                                        <div className="absolute inset-0 bg-gradient-to-br from-purple-500/5 to-transparent"></div>
                                        <SafeIcon name="upload-cloud" className="w-20 h-20 opacity-20 group-hover:opacity-100 group-hover:scale-110 transition-all duration-700" color="white" />
                                        <h3 className="font-black text-4xl uppercase italic tracking-tighter relative z-10">Inject Payload</h3>
                                        <input type="file" className="absolute inset-0 opacity-0 cursor-pointer" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-6 font-black uppercase italic tracking-tighter">
                                        <div className="glass p-8 border-l-8 border-green-500 bg-green-500/5 shadow-lg"><span className="text-[10px] opacity-30 block">Protocol</span><div className="text-3xl mt-1">V.74 READY</div></div>
                                        <div className="glass p-8 border-l-8 border-red-600 bg-red-600/5 shadow-lg"><span className="text-[10px] opacity-30 block">Security</span><div className="text-3xl mt-1">ENCRYPTED</div></div>
                                    </div>
                                </div>
                            ) : (
                                <div className="glass p-10 min-h-[800px] border border-white/5 animate-in fade-in duration-1000 shadow-3xl">
                                    <div className="flex justify-between items-end mb-16 border-b border-white/5 pb-10">
                                        <h2 className="text-6xl font-black uppercase italic tracking-tighter matrix-text" style={{color: theme.primary}}>Shadow Vault</h2>
                                        <span className="text-red-500 text-[10px] font-black uppercase bg-red-500/10 px-4 py-2 rounded-full border border-red-500/20 animate-pulse">LOCKED TARGETS: {stats.missing}</span>
                                    </div>
                                    <div className="space-y-6">
                                        {orders.length === 0 ? (
                                            <div className="flex flex-col items-center justify-center py-40 opacity-10">
                                                <SafeIcon name="target" className="w-24 h-24 mb-6" />
                                                <span className="font-black uppercase tracking-[0.8em] text-sm italic text-center">Scanning signals...</span>
                                            </div>
                                        ) : (
                                            orders.map(order => (
                                                <div key={order.id} className={`p-8 rounded-3xl border transition-all duration-500 ${!order.psid ? 'bg-red-900/10 border-red-500/30 radar-pulse shadow-[0_0_50px_rgba(239,68,68,0.1)]' : 'bg-white/[0.02] border-white/10 hover:border-white/30'}`}>
                                                    <div className="flex justify-between items-start mb-10">
                                                        <div>
                                                            <div className="text-4xl font-black uppercase tracking-tighter drop-shadow-lg text-white">{order.recipient_name}</div>
                                                            <div className="text-[11px] font-mono opacity-30 mt-3 uppercase tracking-widest italic">Hash: {order.tracking_number}</div>
                                                        </div>
                                                        <div className={`px-5 py-2 rounded-full text-[10px] font-black uppercase tracking-widest shadow-2xl ${order.psid ? 'bg-green-500 text-black shadow-green-500/20' : 'bg-red-500 text-white animate-pulse shadow-red-500/20'}`}>{order.psid ? 'LOCKED-ON' : 'NO SIGNAL'}</div>
                                                    </div>
                                                    <div className="bg-black/60 p-8 rounded-2xl border border-white/5 shadow-inner">
                                                        <span className="text-[10px] font-black uppercase opacity-20 block mb-6 italic tracking-[0.4em]">Neural Target ID (PSID) Injection Zone</span>
                                                        {editingId === order.id || !order.psid ? (
                                                            <div className="flex gap-3 animate-in zoom-in-95">
                                                                <input autoFocus value={psidInput} onChange={e => setPsidInput(e.target.value)} placeholder="👉 PASTE PSID HERE 👈" className="flex-1 bg-transparent border-b-2 border-white/10 px-4 py-4 text-2xl font-mono text-white outline-none focus:border-purple-500 transition-all placeholder:opacity-10" onKeyPress={e => e.key === 'Enter' && handleSavePsid(order.id)} />
                                                                <button onClick={() => handleSavePsid(order.id)} className="px-14 bg-white text-black font-black uppercase rounded-2xl hover:scale-105 active:scale-95 transition-all shadow-[0_0_40px_#fff] text-xs">Execute Lock</button>
                                                            </div>
                                                        ) : (
                                                            <div className="flex items-center justify-between group/edit">
                                                                <span className="text-3xl font-mono text-white/80 tracking-widest font-bold">{order.psid}</span>
                                                                <button onClick={() => {setEditingId(order.id); setPsidInput(order.psid);}} className="opacity-0 group-hover/edit:opacity-100 p-4 transition-all text-white/20 hover:text-white bg-white/5 rounded-2xl scale-110 active:scale-90"><SafeIcon name="edit-3" className="w-5 h-5" /></button>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    <footer className="fixed bottom-0 w-full h-12 border-t border-white/5 bg-black/90 backdrop-blur-3xl z-50 flex items-center overflow-hidden shadow-2xl">
                        <div className="flex items-center gap-24 whitespace-nowrap animate-ticker px-12 text-white/40">
                            {[1,2,3,4,5].map(i => (
                                <div key={i} className="flex items-center gap-12">
                                    <span className="text-[11px] font-black uppercase tracking-[0.6em] text-purple-400 matrix-text">SHADOW PROTOCOL // V.74 ACTIVE // LIVE SIGNAL // {brand} EMPIRE</span>
                                    <SafeIcon name="zap" className="w-4 h-4" color="#facc15" />
                                    <span className="text-[11px] font-black uppercase tracking-[0.6em]">ARMED: {stats.count} | TARGETS READY: {stats.ready} | REVENUE: ฿{stats.total.toLocaleString()}</span>
                                    <SafeIcon name="shield-check" className="w-4 h-4" color="#22c55e" />
                                </div>
                            ))}
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
